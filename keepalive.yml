# Đặt file này tại: .github/workflows/keepalive.yml trong repository GitHub
# Chạy lúc 09:00 giờ Việt Nam (02:00 UTC) vào thứ Hai và thứ Năm
name: keepalive
on:
  schedule:
    - cron: '0 2 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi cơ sở dữ liệu Supabase
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
