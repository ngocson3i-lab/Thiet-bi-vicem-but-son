<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Quản lý thiết bị - Bút Sơn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#EEF1EF; --card:#FFFFFF; --tx:#1B2A2E; --mut:#8B9491; --sec:#5B615F;
  --pri:#2B6E76; --accent:#C97A2B; --bd:#D7DCDB;
  --ok:#3F7D4F; --ok-tx:#2C5A38; --warn:#C97A2B; --warn-tx:#8F5620;
  --bad:#B23A32; --bad-tx:#832823;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14.5px;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
input,select,textarea,button{font:inherit;color:var(--tx);font-family:inherit}
.searchbar{display:flex;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:10px 16px 8px}
.searchbar input{border:none;outline:none;margin-left:8px;font-size:14px;flex:1;background:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px}
.chip{white-space:nowrap;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:13px;background:#fff;color:var(--sec)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{flex:1;overflow-y:auto;padding:0 16px 12px}
.item{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.item .t{font-size:14.5px;font-weight:600;letter-spacing:0.1px}
.item .s{font-size:12.5px;color:var(--sec);margin-top:3px}
.star{font-size:19px;background:none;border:none;padding:0 2px;color:var(--mut);line-height:1}
.star.on{color:var(--accent)}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--sec);margin-right:6px}
.status-dot{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700}
.status-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
nav{display:flex;background:#fff;border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);padding:4px 0;font-size:11px}
nav button.on{color:var(--pri)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);max-width:480px;margin:0 auto}
.sheet.show{display:flex}
.sheet .bar{padding:12px 16px;background:#fff;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .bar button{background:none;border:none;color:var(--pri);font-size:14px;cursor:pointer}
.sheet .body{flex:1;overflow-y:auto;padding:14px 16px}
label{display:block;font-size:12.5px;color:var(--mut);margin:14px 0 5px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;background:#fff;font-size:14px}
textarea.f{min-height:100px}
.btn{border:1px solid var(--bd);border-radius:8px;padding:9px 14px;background:#fff;cursor:pointer;font-size:14px}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.d{color:var(--bad);border-color:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.log{border-left:3px solid var(--pri);padding:6px 10px;margin:8px 0;background:#fff;border-radius:0 8px 8px 0;font-size:13.5px}
.log small{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px}
.stat b{font-size:24px;display:block;margin-bottom:2px}
h3{margin:16px 0 8px;font-size:14px;color:var(--sec)}
h2{margin:2px 0 2px;font-size:17px;font-weight:600;letter-spacing:0.2px}
#login{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:340px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:24px}
#login h2{margin-bottom:16px}
#login .btn{width:100%;margin-top:6px}
</style>
</head>
<body>
<div id="login"><div class="box">
  <h2>Quản lý thiết bị - Bút Sơn</h2>
  <label>Email</label><input class="f" id="em" type="email" autocomplete="username">
  <label>Mật khẩu</label><input class="f" id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <p id="lerr" style="color:var(--bad);font-size:13px;min-height:18px"></p>
  <button class="btn p" onclick="doLogin()">Đăng nhập</button>
</div></div>

<div class="searchbar"><span style="color:var(--mut)">🔍</span><input id="q" type="search" placeholder="Tìm theo tên, mã, vị trí…" oninput="render()"><button onclick="document.getElementById('q').value='';render()" style="border:none;background:none;color:var(--mut);cursor:pointer" id="clearq"></button></div>
<div class="chips" id="chips"></div>
<main id="list"></main>
<nav>
  <button id="n3" onclick="tab('sum')">Tổng quan</button>
  <button id="n1" class="on" onclick="tab('list')">Thiết bị</button>
  <button id="n2" onclick="tab('star')">⭐ Quan trọng</button>
  <button id="n4" onclick="tab('data')">Dữ liệu</button>
  <button onclick="openForm()">＋ Thêm</button>
</nav>

<div class="sheet" id="sheet"><div class="bar"><button onclick="closeSheet()">‹ Quay lại</button><div class="row" id="sbtns"></div></div><div class="body" id="sbody"></div></div>

<script>
// ====== DÁN THÔNG TIN SUPABASE CỦA BẠN VÀO 2 DÒNG DƯỚI ======
const SB_URL="https://iqnffejokjrqsziqvumi.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbmZmZWpva2pycXN6aXF2dW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTk0MTYsImV4cCI6MjEwNjE3NTQxNn0.SJ-aEp1xpktg0QiDxW7mF8TpqmglWOaA-tCJKQqKfGc";
// ============================================================
const sb=supabase.createClient(SB_URL,SB_KEY);
const TYPES=['Máy biến áp','Rơ le bảo vệ','Động cơ','Biến tần (VFD)','PLC','Máy cắt','Khác'];
const STATUS={
  hoat_dong:{label:'Đang hoạt động',c:'var(--ok-tx)'},
  can_bao_tri:{label:'Cần bảo trì',c:'var(--warn-tx)'},
  su_co:{label:'Sự cố / Hỏng',c:'var(--bad-tx)'},
  ngung:{label:'Ngừng hoạt động',c:'var(--sec)'},
};
let items=[],filter='Tất cả',view='list';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const err=e=>alert('Lỗi: '+(e.message||e));

async function init(){const{data:{session}}=await sb.auth.getSession();session?start():$('login').style.display='flex'}
async function doLogin(){$('lerr').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 error?$('lerr').textContent='Sai email hoặc mật khẩu':start()}
async function start(){$('login').style.display='none';await loadAll();render()}
async function loadAll(){let all=[],from=0;for(;;){const{data,error}=await sb.from('devices').select('*').order('name').range(from,from+999);
 if(error)return err(error);all=all.concat(data);if(data.length<1000)break;from+=1000}items=all}
async function logout(){await sb.auth.signOut();location.reload()}

function tab(v){view=v;['sum','list','star','data'].forEach((x,i)=>{});
 $('n1').classList.toggle('on',v==='list');$('n2').classList.toggle('on',v==='star');
 $('n3').classList.toggle('on',v==='sum');$('n4').classList.toggle('on',v==='data');render()}
function render(){const ts=['Tất cả',...new Set(items.map(i=>i.type).filter(Boolean))];
 $('chips').style.display=(view==='list'||view==='star')?'flex':'none';
 $('chips').innerHTML=ts.map(t=>`<button class="chip ${t===filter?'on':''}" onclick="filter='${t}';render()">${t}</button>`).join('');
 document.querySelector('.searchbar').style.display=(view==='list'||view==='star')?'flex':'none';
 const L=$('list');if(view==='sum')return L.innerHTML=summary();if(view==='data')return L.innerHTML=dataView();
 const q=norm($('q').value);
 let a=items.filter(i=>(view!=='star'||i.star)&&(filter==='Tất cả'||i.type===filter)&&(!q||norm([i.name,i.code,i.type,i.area,i.note].join(' ')).includes(q)));
 const n=a.length;a=a.slice(0,100);
 L.innerHTML=(a.map(i=>{const st=STATUS[i.status]||STATUS.hoat_dong;
  return `<div class="item" onclick="openView('${i.id}')"><button class="star ${i.star?'on':''}" onclick="event.stopPropagation();toggle('${i.id}')">${i.star?'★':'☆'}</button><div style="flex:1;min-width:0"><div class="t">${esc(i.name)}</div><div class="s">${esc(i.code)}${i.code?' · ':''}${esc(i.area)}</div><div class="s" style="margin-top:6px"><span class="badge">${esc(i.type)}</span><span class="status-dot" style="color:${st.c}">${st.label}</span></div></div></div>`}).join('')||`<div class="empty">Không có thiết bị nào</div>`)+(n>100?`<div class="empty">Hiện 100/${n} kết quả — gõ thêm từ khóa để lọc</div>`:'')}
async function toggle(id){const i=items.find(x=>x.id===id),v=!i.star;const{error}=await sb.from('devices').update({star:v,updated_at:new Date()}).eq('id',id);if(error)return err(error);i.star=v;render()}
function summary(){const c=k=>items.filter(i=>i.status===k).length,w=items.filter(i=>i.status!=='hoat_dong').slice(0,30);
 return `<div class="grid2"><div class="stat"><b>${items.length}</b>Tổng thiết bị</div><div class="stat"><b style="color:var(--accent)">${items.filter(i=>i.star).length}</b>Quan trọng</div><div class="stat"><b style="color:var(--warn-tx)">${c('can_bao_tri')}</b>Cần bảo trì</div><div class="stat"><b style="color:var(--bad-tx)">${c('su_co')}</b>Sự cố / Hỏng</div></div><h3>Cần chú ý</h3>`+(w.map(i=>{const st=STATUS[i.status];return `<div class="item" onclick="openView('${i.id}')"><div><div class="t">${esc(i.name)}</div><div class="s"><span class="status-dot" style="color:${st.c}">${st.label}</span></div></div></div>`}).join('')||`<div class="empty">Chưa có thiết bị cần chú ý</div>`)}
function dataView(){return `<h3>Dữ liệu</h3><p class="s">Lưu trên máy chủ, mọi thiết bị đăng nhập đều thấy cùng một bộ.</p><div class="row"><button class="btn p" onclick="exp()">⬇ Sao lưu JSON</button><button class="btn" onclick="expCsv()">⬇ Xuất CSV</button><button class="btn" onclick="$('f').click()">⬆ Nhập JSON/CSV</button><button class="btn d" onclick="logout()">Đăng xuất</button></div><input id="f" type="file" accept=".json,.csv" style="display:none" onchange="imp(this.files[0])"><p class="s" style="margin-top:10px">CSV: dòng đầu <code>name,code,type,area,status,note</code> (status: hoat_dong/can_bao_tri/su_co/ngung). Nhập sẽ ghi đè thiết bị trùng tên+mã.</p>`}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function exp(){dl('thiet-bi-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(items),'application/json')}
function expCsv(){const r=[['name','code','type','area','status','note'],...items.map(i=>[i.name,i.code,i.type,i.area,i.status,i.note])];dl('thiet-bi.csv','\ufeff'+r.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function parseCsv(t){const R=[];let r=[],f='',q=false;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','||c==';'){r.push(f);f=''}else if(c=='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!='\r')f+=c}if(f||r.length){r.push(f);R.push(r)}return R}
const TYPE_MAP={plc:'PLC','biến tần (vfd)':'Biến tần (VFD)'};
const STATUS_MAP={hoat_dong:'hoat_dong',theo_doi:'can_bao_tri',can_bao_tri:'can_bao_tri',hong:'su_co',su_co:'su_co',ngung:'ngung'};
function imp(file){if(!file)return;const rd=new FileReader();rd.onload=async()=>{try{let arr,logs=[];
 if(file.name.endsWith('.csv')){const R=parseCsv(rd.result),h=R[0].map(x=>x.trim().toLowerCase());arr=R.slice(1).filter(r=>r.some(x=>x)).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]);return o})}
 else{const j=JSON.parse(rd.result);arr=Array.isArray(j)?j:(j.items||j.devices||j.thietbi||j.equipment||[]);logs=Array.isArray(j)?[]:(j.logs||j.hist||j.history||[])}
 const logsByOld={};logs.forEach(l=>{const eid=l.equipmentId||l.deviceId||l.id;if(!eid)return;
  (logsByOld[eid]=logsByOld[eid]||[]).push({d:l.date||l.d||'',t:[l.type,l.description||l.desc||l.t,l.technician?('- '+l.technician):''].filter(Boolean).join(': ')})});
 const rows=arr.map(o=>{const rawType=(o.type||o.loai||'').trim();const type=TYPE_MAP[rawType.toLowerCase()]||rawType||'Khác';
  const rawStatus=(o.status||'').trim();const status=STATUS_MAP[rawStatus]||'hoat_dong';const oldId=o.id;
  return{name:String(o.name||o.ten||'').trim(),code:String(o.code||o.ma||o.assetCode||''),type,area:o.area||o.khuvuc||o.location||'',status,note:o.note||o.ghichu||o.notes||'',star:!!(o.star||o.important||o.critical),hist:o.hist||o.history||(oldId&&logsByOld[oldId])||[]}}).filter(r=>r.name);
 const seen=new Map();rows.forEach(r=>seen.set(r.name+'\u0001'+r.code,r));const U=[...seen.values()];
 if(!U.length)return alert('File không có thiết bị nào.');
 if(!confirm('Nhập '+U.length+' thiết bị? Thiết bị trùng tên+mã sẽ bị ghi đè.\nNên sao lưu trước.'))return;
 for(let i=0;i<U.length;i+=200){const{error}=await sb.from('devices').upsert(U.slice(i,i+200),{onConflict:'name,code'});if(error)return err(error)}
 await loadAll();alert('Đã nhập xong '+U.length+' thiết bị');tab('list')}catch(e){err(e)}};rd.readAsText(file)}

function sheet(b,h){$('sbtns').innerHTML=b;$('sbody').innerHTML=h;$('sheet').classList.add('show')}
function closeSheet(){$('sheet').classList.remove('show');render()}
function openView(id){const i=items.find(x=>x.id===id);const st=STATUS[i.status];
 sheet(`<button onclick="toggle('${id}').then(()=>openView('${id}'))">${i.star?'★ Quan trọng':'☆ Đánh dấu'}</button><button class="btn p" onclick="openForm('${id}')">Sửa</button>`,
 `<h2>${esc(i.name)}</h2><div class="s" style="color:var(--sec);margin-bottom:8px">${esc(i.code)}${i.code?' · ':''}${esc(i.type)} · ${esc(i.area)}</div>
 <span class="status-dot" style="color:${st.c};font-size:14px">${st.label}</span>
 <h3>Ghi chú / Thông số</h3><div style="white-space:pre-wrap;font-size:13.5px">${esc(i.note)||"<i style='color:var(--mut)'>Chưa có</i>"}</div>
 <h3>Nhật ký bảo trì / sự cố</h3><textarea class="f" id="hn" placeholder="VD: Thay vòng bi DE, đo cách điện 500MΩ..."></textarea>
 <div style="margin-top:8px"><button class="btn p" onclick="addLog('${id}')">Lưu nhật ký</button></div>
 ${(i.hist||[]).slice().reverse().map(h=>`<div class="log"><small>${esc(h.d)}</small><br>${esc(h.t)}</div>`).join('')}`)}
async function addLog(id){const t=$('hn').value.trim();if(!t)return;const i=items.find(x=>x.id===id),h=[...(i.hist||[]),{d:new Date().toLocaleString('vi-VN'),t}];
 const{error}=await sb.from('devices').update({hist:h,updated_at:new Date()}).eq('id',id);if(error)return err(error);i.hist=h;openView(id)}
function openForm(id){const i=id?items.find(x=>x.id===id):{name:'',code:'',type:'Động cơ',area:'',status:'hoat_dong',note:''};
 sheet(`${id?`<button class="btn d" onclick="del('${id}')">Xóa</button>`:''}<button class="btn p" onclick="saveForm('${id||''}')">Lưu</button>`,
 `<label>Tên thiết bị *</label><input class="f" id="fn" value="${esc(i.name)}">
 <label>Loại thiết bị</label><select class="f" id="ft">${TYPES.map(t=>`<option ${t===i.type?'selected':''}>${t}</option>`).join('')}</select>
 <label>Mã thiết bị / số hiệu</label><input class="f" id="fc" value="${esc(i.code)}">
 <label>Khu vực / Vị trí</label><input class="f" id="fa" value="${esc(i.area)}">
 <label>Trạng thái</label><select class="f" id="fs">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===i.status?'selected':''}>${v.label}</option>`).join('')}</select>
 <label>Ghi chú / Thông số kỹ thuật</label><textarea class="f" id="fo" style="min-height:160px">${esc(i.note)}</textarea>`)}
async function saveForm(id){const n=$('fn').value.trim();if(!n)return alert('Nhập tên thiết bị');
 const v={name:n,code:$('fc').value.trim(),type:$('ft').value,area:$('fa').value.trim(),status:$('fs').value,note:$('fo').value,updated_at:new Date()};
 const r=id?await sb.from('devices').update(v).eq('id',id).select().single():await sb.from('devices').insert(v).select().single();
 if(r.error)return err(r.error.code==='23505'?'Đã có thiết bị trùng tên và mã':r.error);
 if(id)Object.assign(items.find(x=>x.id===id),r.data);else items.unshift(r.data);id?openView(id):closeSheet()}
async function del(id){if(!confirm('Xóa thiết bị này? Không hoàn tác được.'))return;const{error}=await sb.from('devices').delete().eq('id',id);if(error)return err(error);items=items.filter(x=>x.id!==id);closeSheet()}
init();
</script>
</body>
</html>
