<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Quản lý thiết bị - Bút Sơn</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#EEF1EF; --card:#FFFFFF; --tx:#1B2A2E; --mut:#8B9491; --sec:#5B615F;
  --pri:#2B6E76; --accent:#C97A2B; --bd:#D7DCDB;
  --ok:#3F7D4F; --ok-tx:#2C5A38; --warn:#C97A2B; --warn-tx:#8F5620;
  --bad:#B23A32; --bad-tx:#832823; --badbg:#FBE9E7;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14.5px;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
input,select,textarea,button{font:inherit;color:var(--tx);font-family:inherit}
svg{display:block;flex-shrink:0}
.searchbar{display:flex;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.searchbar input{border:none;outline:none;margin-left:8px;font-size:14px;flex:1;background:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:4px;border:1px solid var(--bd);background:#fff;color:var(--sec)}
.chip.on{border-color:var(--pri);background:var(--pri);color:#fff}
.chip.crit.on{border-color:var(--accent);background:var(--accent)}
main{flex:1;overflow-y:auto;padding:14px 16px 4px}
.item{width:100%;text-align:left;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.item .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--sec);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.star-btn{background:none;border:none;cursor:pointer;display:flex;padding:2px}
.badge{font-size:11px;font-weight:600}
nav{display:flex;background:#fff;border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);padding:6px 2px;font-size:10.5px}
nav button.on{color:var(--pri)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{display:flex}
.sheet-body{flex:1;overflow-y:auto;padding:16px 16px 4px}
.detail-hdr{background:#1B2A2E;color:#F3F5F4;padding:16px 16px 14px;display:flex;align-items:center;gap:10px}
.detail-hdr button{background:none;border:none;color:#F3F5F4;cursor:pointer;display:flex}
.detail-hdr .title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.info-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bg)}
.info-row:last-of-type{border-bottom:none}
.info-row .ic{color:var(--mut);display:flex}
.info-row .lbl{font-size:12.5px;color:var(--sec);width:100px;flex-shrink:0}
.info-row .val{font-size:13.5px;font-weight:500}
.notes{font-size:13px;color:var(--sec);margin-top:10px;padding-top:10px;border-top:1px solid var(--bg);white-space:pre-wrap}
.actrow{display:flex;gap:8px;margin-bottom:18px}
.btn-primary{flex:1;background:var(--pri);color:#fff;border:none;border-radius:8px;padding:10px 0;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-icon{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex}
.confirm-del{background:var(--badbg);border-radius:8px;padding:10px 12px;margin-bottom:18px;font-size:13px}
.confirm-del .row{display:flex;gap:8px;margin-top:8px}
.confirm-del button{border:none;border-radius:6px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.section-label{font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--mut);text-transform:uppercase;margin:0 0 10px}
.log-item{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.log-item .r1{display:flex;justify-content:space-between;font-size:12.5px}
.log-item .r1 b{font-weight:600}
.log-item .r1 span{color:var(--mut);font-family:ui-monospace,monospace}
.log-item .desc{font-size:13px;margin-top:4px}
.log-item .tech{font-size:11.5px;color:var(--mut);margin-top:4px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:30px 10px}
.form-shell{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:6}
.form-body{flex:1;overflow-y:auto;padding:16px}
.form-footer{padding:14px;background:#fff;border-top:1px solid var(--bd)}
.form-footer button{width:100%;background:var(--pri);color:#fff;border:none;border-radius:8px;padding:12px 0;font-size:14.5px;font-weight:600;cursor:pointer}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--sec);margin-bottom:5px;margin-top:14px}
label.f:first-child{margin-top:0}
.field{width:100%;border:1px solid var(--bd);border-radius:7px;padding:9px 10px;font-size:14px;background:#fff;font-family:inherit}
textarea.field{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px}
.stat b{font-size:24px;display:block;margin-bottom:2px}
#login{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:340px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:24px}
#login h2{margin:0 0 16px}
.dataview .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dataview button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:9px 14px;font-size:13.5px;cursor:pointer}
.dataview button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.dataview button.d{color:var(--bad)}
</style>
</head>
<body>
<div id="login"><div class="box">
  <h2>Quản lý thiết bị - Bút Sơn</h2>
  <label class="f">Email</label><input class="field" id="em" type="email" autocomplete="username">
  <label class="f">Mật khẩu</label><input class="field" id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <p id="lerr" style="color:var(--bad);font-size:13px;min-height:18px"></p>
  <button class="form-footer button" style="width:100%;background:var(--pri);color:#fff;border:none;border-radius:8px;padding:12px 0;font-weight:600;cursor:pointer" onclick="doLogin()">Đăng nhập</button>
</div></div>

<main id="listWrap">
  <div class="searchbar" id="searchbar" style="margin-bottom:10px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B9491" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="q" type="search" placeholder="Tìm theo tên, mã, vị trí…" oninput="render()">
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>

<nav>
  <button id="n3" onclick="tab('sum')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    Tổng quan
  </button>
  <button id="n1" class="on" onclick="tab('list')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/></svg>
    Thiết bị
  </button>
  <button id="btnExp" onclick="exp()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/></svg>
    Xuất dữ liệu
  </button>
  <button id="btnImp" onclick="document.getElementById('f').click()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9"/><path d="M6 13l6-6 6 6"/><path d="M4 3h16"/></svg>
    Nhập dữ liệu
  </button>
  <button id="btnAdd" onclick="openForm()" style="color:var(--pri)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Thêm
  </button>
</nav>
<input id="f" type="file" accept=".json,.csv" style="display:none" onchange="imp(this.files[0])">

<div class="sheet" id="sheet"><div class="sheet-body" id="sbody"></div></div>

<script>
const SB_URL="https://iqnffejokjrqsziqvumi.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbmZmZWpva2pycXN6aXF2dW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTk0MTYsImV4cCI6MjEwNjE3NTQxNn0.SJ-aEp1xpktg0QiDxW7mF8TpqmglWOaA-tCJKQqKfGc";
const sb=supabase.createClient(SB_URL,SB_KEY);
const TYPES=['Máy biến áp','Rơ le bảo vệ','Động cơ','Biến tần (VFD)','PLC','Máy cắt','Khác'];
const STATUS={
  hoat_dong:{label:'Đang hoạt động',swatch:'#3F7D4F',text:'#2C5A38'},
  can_bao_tri:{label:'Cần bảo trì',swatch:'#C97A2B',text:'#8F5620'},
  su_co:{label:'Sự cố / Hỏng',swatch:'#B23A32',text:'#832823'},
  ngung:{label:'Ngừng hoạt động',swatch:'#8B9491',text:'#5B615F'},
};
const LOG_TYPES=['Bảo trì định kỳ','Sự cố','Sửa chữa','Kiểm tra'];
let items=[],filter='Tất cả',critOnly=false,view='list';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const err=e=>alert('Lỗi: '+(e.message||e));
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtDate=iso=>{if(!iso)return null;const d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;return d.toLocaleDateString('vi-VN')};
function ICON(name){const M={
 star:'<svg width="18" height="18" viewBox="0 0 24 24" __FILL__ stroke="__COLOR__" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
 gauge:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 12 15 9"/></svg>',
 zap:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
 pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
 pinsm:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
 cal:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
 clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
 wrench:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg>',
 pencil:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B2A2E" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
 trash:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B23A32" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F4" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>',
 x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F5F4" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
};return M[name]||''}
function starIcon(on){return ICON('star').replace('__FILL__',on?'fill="var(--accent)"':'fill="none"').replace('__COLOR__',on?'var(--accent)':'#D7DCDB')}

async function init(){const{data:{session}}=await sb.auth.getSession();session?start():$('login').style.display='flex'}
async function doLogin(){$('lerr').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 error?$('lerr').textContent='Sai email hoặc mật khẩu':start()}
async function start(){$('login').style.display='none';await loadAll();render()}
async function loadAll(){let all=[],from=0;for(;;){const{data,error}=await sb.from('devices').select('*').order('name').range(from,from+999);
 if(error)return err(error);all=all.concat(data);if(data.length<1000)break;from+=1000}items=all}
async function logout(){await sb.auth.signOut();location.reload()}

function tab(v){view=v;
 $('n1').classList.toggle('on',v==='list');$('n3').classList.toggle('on',v==='sum');
 if(v==='data'){dataView();return}
 $('searchbar').style.display=(v==='list')?'flex':'none';
 $('listWrap').style.display='block';
 render()}
function chips(){const ts=['Tất cả',...new Set(items.map(i=>i.type).filter(Boolean))];
 $('chips').style.display=(view==='list')?'flex':'none';
 let h=`<button class="chip crit ${critOnly?'on':''}" onclick="critOnly=!critOnly;render()">${ICON('star').replace('__FILL__',critOnly?'fill="#fff"':'fill="none"').replace('__COLOR__',critOnly?'#fff':'currentColor').replace('width="18" height="18"','width="12" height="12"')} Quan trọng</button>`;
 h+=ts.map(t=>`<button class="chip ${t===filter?'on':''}" onclick="filter='${t.replace(/'/g,"\\'")}';render()">${esc(t)}</button>`).join('');
 $('chips').innerHTML=h}
function render(){if(view!=='list'&&view!=='sum'){return}
 chips();
 const L=$('list');
 if(view==='sum'){$('searchbar').style.display='none';L.innerHTML=summary();return}
 const q=norm($('q').value);
 let a=items.filter(i=>(!critOnly||i.star)&&(filter==='Tất cả'||i.type===filter)&&(!q||norm([i.name,i.code,i.type,i.area,i.note].join(' ')).includes(q)));
 const n=a.length;a=a.slice(0,100);
 L.innerHTML=(a.map(i=>{const st=STATUS[i.status]||STATUS.hoat_dong;
  return `<button class="item" onclick="openView('${i.id}')"><div style="flex:1;min-width:0"><div class="t">${esc(i.name)}</div><div class="s"><span>${esc(i.type)}</span>${i.area?`<span>${ICON('pinsm')}${esc(i.area)}</span>`:''}</div></div><div style="text-align:right;flex-shrink:0"><div class="badge" style="color:${st.text}">${st.label}</div></div></button>`
 }).join('')||`<div class="empty">Chưa có thiết bị nào phù hợp. Nhấn nút + để thêm thiết bị mới.</div>`)+(n>100?`<div class="empty">Hiện 100/${n} kết quả — gõ thêm từ khóa để lọc</div>`:'')}
async function toggle(id){const i=items.find(x=>x.id===id),v=!i.star;const{error}=await sb.from('devices').update({star:v,updated_at:new Date()}).eq('id',id);if(error)return err(error);i.star=v}
function summary(){const c=k=>items.filter(i=>i.status===k).length,w=items.filter(i=>i.status!=='hoat_dong').slice(0,30);
 return `<div class="grid2"><div class="stat"><b>${items.length}</b>Tổng thiết bị</div><div class="stat"><b style="color:var(--accent)">${items.filter(i=>i.star).length}</b>Quan trọng</div><div class="stat"><b style="color:var(--warn-tx)">${c('can_bao_tri')}</b>Cần bảo trì</div><div class="stat"><b style="color:var(--bad-tx)">${c('su_co')}</b>Sự cố / Hỏng</div></div><p class="section-label">Cần chú ý</p>`+(w.map(i=>{const st=STATUS[i.status];return `<button class="item" onclick="openView('${i.id}')"><div><div class="t">${esc(i.name)}</div><div class="s"><span style="color:${st.text};font-weight:600">${st.label}</span></div></div></button>`}).join('')||`<div class="empty">Chưa có thiết bị cần chú ý</div>`)}

function dataView(){$('searchbar').style.display='none';$('chips').style.display='none';
 $('list').innerHTML=`<div class="dataview"><p class="section-label">Dữ liệu</p><p style="color:var(--sec);font-size:13px">Dữ liệu lưu trên máy chủ, mọi thiết bị đăng nhập đều thấy cùng một bộ.</p><div class="row"><button class="d" onclick="logout()">Đăng xuất</button></div></div>`}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function exp(){dl('thiet-bi-export-'+todayISO()+'.json',JSON.stringify({exportedAt:new Date().toISOString(),equipment:items}),'application/json')}
function parseCsv(t){const R=[];let r=[],f='',q=false;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','||c==';'){r.push(f);f=''}else if(c=='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!='\r')f+=c}if(f||r.length){r.push(f);R.push(r)}return R}
const TYPE_MAP={plc:'PLC','biến tần (vfd)':'Biến tần (VFD)'};
const STATUS_MAP={hoat_dong:'hoat_dong',theo_doi:'can_bao_tri',can_bao_tri:'can_bao_tri',hong:'su_co',su_co:'su_co',ngung:'ngung',tot:'hoat_dong',theo:'can_bao_tri'};
function imp(file){if(!file)return;const rd=new FileReader();rd.onload=async()=>{try{let arr,logs=[];
 if(file.name.endsWith('.csv')){const R=parseCsv(rd.result),h=R[0].map(x=>x.trim().toLowerCase());arr=R.slice(1).filter(r=>r.some(x=>x)).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]);return o})}
 else{const j=JSON.parse(rd.result);arr=Array.isArray(j)?j:(j.equipment||j.items||j.devices||j.thietbi||[]);logs=Array.isArray(j)?[]:(j.logs||j.hist||j.history||[])}
 const logsByOld={};logs.forEach(l=>{const eid=l.equipmentId||l.deviceId||l.id;if(!eid)return;
  (logsByOld[eid]=logsByOld[eid]||[]).push({d:l.date||l.d||'',t:l.type||'',desc:l.description||l.desc||l.t||'',tech:l.technician||''})});
 const rows=arr.map(o=>{const rawType=(o.type||o.loai||'').trim();const type=TYPE_MAP[rawType.toLowerCase()]||rawType||'Khác';
  const rawStatus=(o.status||'').trim();const status=STATUS_MAP[rawStatus]||'hoat_dong';const oldId=o.id;
  return{name:String(o.name||o.ten||'').trim(),code:String(o.code||o.ma||o.assetCode||''),type,area:o.area||o.khuvuc||o.location||'',status,
   install_date:o.installDate||o.install_date||'',note:o.note||o.ghichu||o.notes||'',star:!!(o.star||o.important||o.critical),
   hist:o.hist||o.history||(oldId&&logsByOld[oldId])||[]}}).filter(r=>r.name);
 const seen=new Map();rows.forEach(r=>seen.set(r.name+'\u0001'+r.code,r));const U=[...seen.values()];
 if(!U.length)return alert('File không có thiết bị nào.');
 if(!confirm('Nhập '+U.length+' thiết bị? Thiết bị trùng tên+mã sẽ bị ghi đè.\nNên sao lưu trước.'))return;
 for(let i=0;i<U.length;i+=200){const{error}=await sb.from('devices').upsert(U.slice(i,i+200),{onConflict:'name,code'});if(error)return err(error)}
 await loadAll();alert('Đã nhập xong '+U.length+' thiết bị');tab('list')}catch(e){err(e)}};rd.readAsText(file)}

function sheetOpen(html){$('sbody').innerHTML=html;$('sheet').classList.add('show')}
function closeSheet(){$('sheet').classList.remove('show')}

function openView(id){const i=items.find(x=>x.id===id);const st=STATUS[i.status]||STATUS.hoat_dong;
 const lastMaint=(i.hist&&i.hist.length)?i.hist.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).pop().date:null;
 sheetOpen(`
 <div class="detail-hdr"><button onclick="closeSheet()">${ICON('back')}</button><div class="title">${esc(i.name)}</div></div>
 <div class="sheet-body">
 <div class="card">
  <div class="card-top">
   <div style="font-size:12.5px;font-weight:700;color:${st.text}">${st.label}</div>
   <button class="star-btn" onclick="toggle('${id}').then(()=>openView('${id}'))">${starIcon(i.star)}<span style="font-size:11.5px;margin-left:4px;color:${i.star?'var(--accent)':'var(--mut)'}">${i.star?'Thiết bị quan trọng':'Đánh dấu quan trọng'}</span></button>
  </div>
  <div class="info-row"><div class="ic">${ICON('gauge')}</div><div class="lbl">Loại thiết bị</div><div class="val">${esc(i.type)}</div></div>
  ${i.code?`<div class="info-row"><div class="ic">${ICON('zap')}</div><div class="lbl">Mã thiết bị</div><div class="val" style="font-family:ui-monospace,monospace">${esc(i.code)}</div></div>`:''}
  ${i.area?`<div class="info-row"><div class="ic">${ICON('pin')}</div><div class="lbl">Vị trí</div><div class="val">${esc(i.area)}</div></div>`:''}
  ${i.install_date?`<div class="info-row"><div class="ic">${ICON('cal')}</div><div class="lbl">Lắp đặt</div><div class="val">${fmtDate(i.install_date)}</div></div>`:''}
  <div class="info-row"><div class="ic">${ICON('clock')}</div><div class="lbl">Bảo trì gần nhất</div><div class="val">${lastMaint?fmtDate(lastMaint):'—'}</div></div>
  ${i.note?`<div class="notes">${esc(i.note)}</div>`:''}
 </div>
 <div class="actrow">
  <button class="btn-primary" onclick="openLogForm('${id}')">${ICON('wrench')} Ghi nhận bảo trì / sự cố</button>
  <button class="btn-icon" onclick="openForm('${id}')">${ICON('pencil')}</button>
  <button class="btn-icon" onclick="toggleDel('${id}')">${ICON('trash')}</button>
 </div>
 <div id="delbox"></div>
 <p class="section-label">Lịch sử bảo trì &amp; sự cố</p>
 ${(i.hist&&i.hist.length)?i.hist.slice().reverse().map(h=>`<div class="log-item"><div class="r1"><b>${esc(h.type||h.t||'')}</b><span>${fmtDate(h.date||h.d)||''}</span></div>${(h.description||h.desc)?`<div class="desc">${esc(h.description||h.desc)}</div>`:''}${(h.technician||h.tech)?`<div class="tech">Người thực hiện: ${esc(h.technician||h.tech)}</div>`:''}</div>`).join(''):'<div class="empty">Chưa có ghi nhận nào cho thiết bị này.</div>'}
 </div>`)}
function toggleDel(id){const box=$('delbox');
 box.innerHTML=box.innerHTML?'':`<div class="confirm-del">Xóa thiết bị này và toàn bộ lịch sử bảo trì?<div class="row"><button style="background:var(--bad);color:#fff" onclick="del('${id}')">Xóa</button><button style="background:#fff;border:1px solid var(--bd)" onclick="toggleDel('${id}')">Hủy</button></div></div>`}
async function del(id){const{error}=await sb.from('devices').delete().eq('id',id);if(error)return err(error);items=items.filter(x=>x.id!==id);closeSheet();render()}

function openLogForm(id){const i=items.find(x=>x.id===id);
 sheetOpen(`<div class="form-shell">
 <div class="detail-hdr"><button onclick="openView('${id}')">${ICON('x')}</button><div class="title">Ghi nhận cho: ${esc(i.name)}</div></div>
 <div class="form-body">
  <label class="f">Loại ghi nhận</label><select class="field" id="lt">${LOG_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
  <label class="f">Ngày</label><input class="field" type="date" id="ld" value="${todayISO()}">
  <label class="f">Mô tả</label><textarea class="field" id="ldesc" placeholder="Nội dung công việc, hiện tượng sự cố, cách xử lý…"></textarea>
  <label class="f">Người thực hiện</label><input class="field" id="ltech">
 </div>
 <div class="form-footer"><button onclick="saveLog('${id}')">Lưu</button></div>
 </div>`)}
async function saveLog(id){const i=items.find(x=>x.id===id);
 const h=[...(i.hist||[]),{type:$('lt').value,date:$('ld').value,description:$('ldesc').value,technician:$('ltech').value}];
 const{error}=await sb.from('devices').update({hist:h,updated_at:new Date()}).eq('id',id);if(error)return err(error);i.hist=h;openView(id)}

function openForm(id){const i=id?items.find(x=>x.id===id):{name:'',code:'',type:TYPES[0],area:'',status:'hoat_dong',install_date:'',note:''};
 sheetOpen(`<div class="form-shell">
 <div class="detail-hdr"><button onclick="${id?`openView('${id}')`:'closeSheet()'}">${ICON('x')}</button><div class="title">${id?'Sửa thiết bị':'Thêm thiết bị mới'}</div></div>
 <div class="form-body">
  <label class="f">Tên thiết bị *</label><input class="field" id="fn" value="${esc(i.name)}" placeholder="VD: Máy biến áp T1 - 110kV">
  <label class="f">Loại thiết bị</label><select class="field" id="ft">${TYPES.map(t=>`<option ${t===i.type?'selected':''}>${t}</option>`).join('')}</select>
  <label class="f">Mã thiết bị / số hiệu</label><input class="field" id="fc" value="${esc(i.code)}" placeholder="VD: TR-110-01">
  <label class="f">Vị trí lắp đặt</label><input class="field" id="fa" value="${esc(i.area)}" placeholder="VD: Trạm 110kV - Ngăn lộ 1">
  <label class="f">Trạng thái</label><select class="field" id="fs">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===i.status?'selected':''}>${v.label}</option>`).join('')}</select>
  <label class="f">Ngày lắp đặt</label><input class="field" type="date" id="fi" value="${i.install_date||''}">
  <label class="f">Ghi chú</label><textarea class="field" id="fo" style="min-height:100px">${esc(i.note)}</textarea>
 </div>
 <div class="form-footer"><button onclick="saveForm('${id||''}')">Lưu</button></div>
 </div>`)}
async function saveForm(id){const n=$('fn').value.trim();if(!n)return;
 const v={name:n,code:$('fc').value.trim(),type:$('ft').value,area:$('fa').value.trim(),status:$('fs').value,install_date:$('fi').value,note:$('fo').value,updated_at:new Date()};
 const r=id?await sb.from('devices').update(v).eq('id',id).select().single():await sb.from('devices').insert(v).select().single();
 if(r.error)return err(r.error.code==='23505'?'Đã có thiết bị trùng tên và mã':r.error);
 if(id){Object.assign(items.find(x=>x.id===id),r.data);openView(id)}else{items.unshift(r.data);closeSheet();render()}}
init();
</script>
</body>
</html>
