<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tra cứu thiết bị</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1a2230;--mut:#6b7686;--pri:#1f5fbf;--bd:#dde3ea;--ok:#1e9e5a;--warn:#e69500;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#12171f;--card:#1b232e;--tx:#e8edf3;--mut:#93a0b1;--bd:#2c3644;--pri:#5b9bff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 12px;cursor:pointer}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.d{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.chip{white-space:nowrap;border-radius:99px;padding:6px 12px;font-size:13px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{flex:1;overflow-y:auto;padding:10px 12px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer}
.t{font-weight:600}.s{color:var(--mut);font-size:13px;margin-top:2px}
.star{font-size:22px;background:none;border:none;padding:0 4px;color:var(--mut)}.star.on{color:#f5b301}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin-right:4px}
.st-tot{color:var(--ok)}.st-theo{color:var(--warn)}.st-hong{color:var(--bad)}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}nav button{flex:1;border:none;border-radius:0;padding:14px 4px;background:none}nav button.on{color:var(--pri);font-weight:700}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{display:flex}.body{flex:1;overflow-y:auto;padding:12px}
.bar{padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}textarea{min-height:80px}
.log{border-left:3px solid var(--pri);padding:4px 10px;margin:6px 0;background:var(--card);border-radius:0 8px 8px 0}.log small{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{font-size:24px;display:block}h3{margin:14px 0 6px}
#login{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:20px}
#login div{width:100%;max-width:340px}
</style>
</head>
<body>
<div id="login"><div><h2>Tra cứu thiết bị</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Mật khẩu</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><p id="lerr" class="st-hong"></p><button class="p" style="width:100%" onclick="doLogin()">Đăng nhập</button></div></div>
<header><div class="row"><input id="q" type="search" placeholder="Tìm theo tên, mã, khu vực, ghi chú..." oninput="render()"><button class="p" onclick="openForm()">＋</button></div></header>
<div class="chips" id="chips"></div><main id="list"></main>
<nav><button id="n1" class="on" onclick="tab('list')">Thiết bị</button><button id="n2" onclick="tab('star')">⭐ Quan trọng</button><button id="n3" onclick="tab('sum')">Tổng quan</button><button id="n4" onclick="tab('data')">Dữ liệu</button></nav>
<div class="sheet" id="sheet"><div class="bar"><button onclick="closeSheet()">← Quay lại</button><div id="sbtns" class="row"></div></div><div class="body" id="sbody"></div></div>

<script>
// ====== DÁN THÔNG TIN SUPABASE CỦA BẠN VÀO 2 DÒNG DƯỚI ======
const SB_URL="https://iqnffejokjrqsziqvumi.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbmZmZWpva2pycXN6aXF2dW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTk0MTYsImV4cCI6MjEwNjE3NTQxNn0.SJ-aEp1xpktg0QiDxW7mF8TpqmglWOaA-tCJKQqKfGc";
// ============================================================
const sb=supabase.createClient(SB_URL,SB_KEY);
const TYPES=["Động cơ","Máy biến áp","Rơ le","Biến tần","PLC/DCS","Máy cắt","Khác"];
const STATUS={tot:"Tốt",theo:"Theo dõi",hong:"Hỏng/Ngừng"};
let items=[],filter="Tất cả",view="list";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
const err=e=>alert("Lỗi: "+(e.message||e));

async function init(){const{data:{session}}=await sb.auth.getSession();session?start():$("login").style.display="flex"}
async function doLogin(){$("lerr").textContent="";const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 error?$("lerr").textContent="Sai email hoặc mật khẩu":start()}
async function start(){$("login").style.display="none";await loadAll();render()}
async function loadAll(){let all=[],from=0;for(;;){const{data,error}=await sb.from("devices").select("*").order("name").range(from,from+999);
 if(error)return err(error);all=all.concat(data);if(data.length<1000)break;from+=1000}items=all}
async function logout(){await sb.auth.signOut();location.reload()}

function tab(v){view=v;["list","star","sum","data"].forEach((x,i)=>$("n"+(i+1)).classList.toggle("on",x===v));render()}
function render(){const ts=["Tất cả",...new Set(items.map(i=>i.type).filter(Boolean))];
 $("chips").style.display=(view==="list"||view==="star")?"flex":"none";
 $("chips").innerHTML=ts.map(t=>`<button class="chip ${t===filter?"on":""}" onclick="filter='${t}';render()">${t}</button>`).join("");
 const L=$("list");if(view==="sum")return L.innerHTML=summary();if(view==="data")return L.innerHTML=dataView();
 const q=norm($("q").value);
 let a=items.filter(i=>(view!=="star"||i.star)&&(filter==="Tất cả"||i.type===filter)&&(!q||norm([i.name,i.code,i.type,i.area,i.note].join(" ")).includes(q)));
 const n=a.length;a=a.slice(0,100);
 L.innerHTML=(a.map(i=>`<div class="item" onclick="openView('${i.id}')"><button class="star ${i.star?"on":""}" onclick="event.stopPropagation();toggle('${i.id}')">${i.star?"★":"☆"}</button><div style="flex:1;min-width:0"><div class="t">${esc(i.name)}</div><div class="s">${esc(i.code)} · ${esc(i.area)}</div><div class="s"><span class="tag">${esc(i.type)}</span><span class="st-${i.status}">${STATUS[i.status]||""}</span></div></div></div>`).join("")||`<div class="empty">Không có thiết bị nào</div>`)+(n>100?`<div class="empty">Hiện 100/${n} kết quả — gõ thêm từ khóa để lọc</div>`:"")}
async function toggle(id){const i=items.find(x=>x.id===id),v=!i.star;const{error}=await sb.from("devices").update({star:v,updated_at:new Date()}).eq("id",id);if(error)return err(error);i.star=v;render()}
function summary(){const c=k=>items.filter(i=>i.status===k).length,w=items.filter(i=>i.status!=="tot").slice(0,30);
 return `<div class="grid"><div class="stat"><b>${items.length}</b>Tổng thiết bị</div><div class="stat"><b>${items.filter(i=>i.star).length}</b>Quan trọng</div><div class="stat"><b class="st-theo">${c("theo")}</b>Đang theo dõi</div><div class="stat"><b class="st-hong">${c("hong")}</b>Hỏng/Ngừng</div></div><h3>Cần chú ý</h3>`+(w.map(i=>`<div class="item" onclick="openView('${i.id}')"><div><div class="t">${esc(i.name)}</div><div class="s">${esc(i.code)} · <span class="st-${i.status}">${STATUS[i.status]}</span></div></div></div>`).join("")||`<div class="empty">Chưa có thiết bị cần chú ý</div>`)}
function dataView(){return `<h3>Dữ liệu</h3><p class="s">Dữ liệu lưu trên máy chủ, mọi thiết bị đăng nhập đều thấy cùng một bộ.</p><div class="row" style="flex-wrap:wrap"><button class="p" onclick="exp()">⬇ Sao lưu JSON</button><button onclick="expCsv()">⬇ Xuất CSV</button><button onclick="$('f').click()">⬆ Nhập JSON/CSV</button><button class="d" onclick="logout()">Đăng xuất</button></div><input id="f" type="file" accept=".json,.csv" style="display:none" onchange="imp(this.files[0])"><p class="s">CSV: dòng đầu <code>name,code,type,area,status,note</code> (status: tot / theo / hong). Nhập sẽ ghi đè thiết bị trùng tên+mã.</p>`}
function dl(n,t,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function exp(){dl("thiet-bi-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(items),"application/json")}
function expCsv(){const r=[["name","code","type","area","status","note"],...items.map(i=>[i.name,i.code,i.type,i.area,i.status,i.note])];dl("thiet-bi.csv","\ufeff"+r.map(x=>x.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv")}
function parseCsv(t){const R=[];let r=[],f="",q=false;t=t.replace(/^\ufeff/,"");for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","||c==";"){r.push(f);f=""}else if(c=="\n"){r.push(f);R.push(r);r=[];f=""}else if(c!="\r")f+=c}if(f||r.length){r.push(f);R.push(r)}return R}
function imp(file){if(!file)return;const rd=new FileReader();rd.onload=async()=>{try{let arr;
 if(file.name.endsWith(".csv")){const R=parseCsv(rd.result),h=R[0].map(x=>x.trim().toLowerCase());arr=R.slice(1).filter(r=>r.some(x=>x)).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]);return o})}
 else{const j=JSON.parse(rd.result);arr=Array.isArray(j)?j:(j.items||j.devices||j.thietbi||[])}
 const rows=arr.map(o=>({name:String(o.name||o.ten||"").trim(),code:String(o.code||o.ma||""),type:o.type||o.loai||"Khác",area:o.area||o.khuvuc||o.location||"",status:["tot","theo","hong"].includes(o.status)?o.status:"tot",note:o.note||o.ghichu||"",star:!!(o.star||o.important),hist:o.hist||o.history||[]})).filter(r=>r.name);
 const seen=new Map();rows.forEach(r=>seen.set(r.name+"\u0001"+r.code,r));const U=[...seen.values()];
 if(!U.length)return alert("File không có thiết bị nào.");
 if(!confirm("Nhập "+U.length+" thiết bị? Thiết bị trùng tên+mã sẽ bị ghi đè.\nNên sao lưu trước."))return;
 for(let i=0;i<U.length;i+=200){const{error}=await sb.from("devices").upsert(U.slice(i,i+200),{onConflict:"name,code"});if(error)return err(error)}
 await loadAll();alert("Đã nhập xong "+U.length+" thiết bị");tab("list")}catch(e){err(e)}};rd.readAsText(file)}

function sheet(b,h){$("sbtns").innerHTML=b;$("sbody").innerHTML=h;$("sheet").classList.add("show")}
function closeSheet(){$("sheet").classList.remove("show");render()}
function openView(id){const i=items.find(x=>x.id===id);
 sheet(`<button onclick="toggle('${id}').then(()=>openView('${id}'))">${i.star?"★ Quan trọng":"☆ Đánh dấu"}</button><button class="p" onclick="openForm('${id}')">Sửa</button>`,
 `<h2 style="margin:4px 0">${esc(i.name)}</h2><div class="s">${esc(i.code)} · ${esc(i.type)} · ${esc(i.area)}</div><p><b class="st-${i.status}">${STATUS[i.status]}</b></p><h3>Ghi chú / Thông số</h3><div style="white-space:pre-wrap">${esc(i.note)||"<i class='s'>Chưa có</i>"}</div>
 <h3>Nhật ký bảo trì / sự cố</h3><textarea id="hn" placeholder="VD: Thay vòng bi DE, cách điện 500MΩ..."></textarea><div style="margin-top:8px"><button class="p" onclick="addLog('${id}')">Lưu nhật ký</button></div>
 ${(i.hist||[]).slice().reverse().map(h=>`<div class="log"><small>${esc(h.d)}</small><br>${esc(h.t)}</div>`).join("")}`)}
async function addLog(id){const t=$("hn").value.trim();if(!t)return;const i=items.find(x=>x.id===id),h=[...(i.hist||[]),{d:new Date().toLocaleString("vi-VN"),t}];
 const{error}=await sb.from("devices").update({hist:h,updated_at:new Date()}).eq("id",id);if(error)return err(error);i.hist=h;openView(id)}
function openForm(id){const i=id?items.find(x=>x.id===id):{name:"",code:"",type:"Động cơ",area:"",status:"tot",note:""};
 sheet(`${id?`<button class="d" onclick="del('${id}')">Xóa</button>`:""}<button class="p" onclick="saveForm('${id||""}')">Lưu</button>`,
 `<label>Tên thiết bị *</label><input id="fn" value="${esc(i.name)}"><label>Mã / Số hiệu</label><input id="fc" value="${esc(i.code)}"><label>Loại</label><select id="ft">${TYPES.map(t=>`<option ${t===i.type?"selected":""}>${t}</option>`).join("")}</select><label>Khu vực / Vị trí</label><input id="fa" value="${esc(i.area)}"><label>Trạng thái</label><select id="fs">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===i.status?"selected":""}>${v}</option>`).join("")}</select><label>Ghi chú / Thông số kỹ thuật</label><textarea id="fo" style="min-height:160px">${esc(i.note)}</textarea>`)}
async function saveForm(id){const n=$("fn").value.trim();if(!n)return alert("Nhập tên thiết bị");
 const v={name:n,code:$("fc").value.trim(),type:$("ft").value,area:$("fa").value.trim(),status:$("fs").value,note:$("fo").value,updated_at:new Date()};
 const r=id?await sb.from("devices").update(v).eq("id",id).select().single():await sb.from("devices").insert(v).select().single();
 if(r.error)return err(r.error.code==="23505"?"Đã có thiết bị trùng tên và mã":r.error);
 if(id)Object.assign(items.find(x=>x.id===id),r.data);else items.unshift(r.data);id?openView(id):closeSheet()}
async function del(id){if(!confirm("Xóa thiết bị này? Không hoàn tác được."))return;const{error}=await sb.from("devices").delete().eq("id",id);if(error)return err(error);items=items.filter(x=>x.id!==id);closeSheet()}
init();
</script>
</body>
</html>
